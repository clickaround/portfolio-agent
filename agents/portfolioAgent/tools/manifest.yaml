# gitagent tool. The arguments arrive as one JSON object on stdin of manifest.sh, which runs
# `portfolio manifest ...` through ../scripts/tool_entry.py. `path` is the spec's key, `script` the one gitagent 2.x reads.
# runtime is `sh`, not `bash`: a Windows program that starts `bash` gets System32\bash.exe (WSL), not Git's.
name: manifest
description: List the project's assets with source IDs.
version: 0.1.0
input_schema:
  type: object
  properties:
    project:
      type: string
      description: Project folder
  required:
  - project
implementation:
  type: script
  path: manifest.sh
  script: manifest.sh
  runtime: sh
