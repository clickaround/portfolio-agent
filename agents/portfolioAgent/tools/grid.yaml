# gitagent tool. The arguments arrive as one JSON object on stdin of grid.sh, which runs
# `portfolio grid ...` through ../scripts/tool_entry.py. `path` is the spec's key, `script` the one gitagent 2.x reads.
# runtime is `sh`, not `bash`: a Windows program that starts `bash` gets System32\bash.exe (WSL), not Git's.
name: grid
description: Show the modular grid the page can hold, as JSON.
version: 0.1.0
input_schema:
  type: object
  properties:
    project:
      type: string
      description: Project folder
    design_plan:
      type: string
      description: design-plan.json
    columns:
      type: integer
      description: Grid columns (default 12)
    width_mm:
      type: number
      description: Page width in mm
    height_mm:
      type: number
      description: Page height in mm
  required:
  - project
implementation:
  type: script
  path: grid.sh
  script: grid.sh
  runtime: sh
