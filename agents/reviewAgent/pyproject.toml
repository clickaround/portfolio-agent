[project]
name = "portfolio-review-agent"
version = "0.1.0"
description = "reviewAgent: fresh-review gate (review-context / record-review / finalize), critic rubric, benchmarks"
requires-python = ">=3.11"
dependencies = ["portfolio-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_agent"]
