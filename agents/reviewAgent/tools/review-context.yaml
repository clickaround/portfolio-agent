# gitagent tool. The arguments arrive as one JSON object on stdin of review-context.sh, which runs
# `portfolio review-context ...` through ../scripts/tool_entry.py. `path` is the spec's key, `script` the one gitagent 2.x reads.
# runtime is `sh`, not `bash`: a Windows program that starts `bash` gets System32\bash.exe (WSL), not Git's.
name: review-context
description: Bind frames, scene hashes and the rubric into review-context.json.
version: 0.1.0
input_schema:
  type: object
  properties:
    out:
      type: string
      description: Attempt output folder
  required:
  - out
implementation:
  type: script
  path: review-context.sh
  script: review-context.sh
  runtime: sh
