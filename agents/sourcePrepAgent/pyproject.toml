[project]
name = "portfolio-sourceprep-agent"
version = "0.1.0"
description = "sourcePrepAgent: trim / levels / knockout / cut-outs; originals preserved, every step recorded in derived.json"
requires-python = ">=3.11"
dependencies = ["portfolio-core", "pillow>=10.0", "numpy>=1.26"]

[project.optional-dependencies]
cutout = ["rembg>=2.0.60", "onnxruntime>=1.18"]   # default cut-out engine (MIT); photocraft needs no Python package (signed binary in .cache/bin)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_agent"]
