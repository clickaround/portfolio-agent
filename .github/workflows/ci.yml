name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.4'
      - name: Install locked workspace
        run: uv sync --locked --python 3.11
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check import boundaries
        run: uv run --locked lint-imports
      - name: Test Python workspace
        run: uv run --locked pytest
      - name: Test benchmark and editor installer regressions
        run: uv run --locked pytest agents/reviewAgent/benchmarks/test_benchmark_runners.py project/tests/test_designcraft_web_install.py

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned DesignCraft web editor
        run: python ../project/scripts/install_designcraft_web.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
