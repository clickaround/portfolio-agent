[project]
name = "portfolio-core"
version = "0.1.0"
description = "Shared kernel of the portfolio agents: model, sources, geometry, quality metrics, guardrails, checks, JSON schemas"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.21",
  "pillow>=10.0",
  "numpy>=1.26",
  "pymupdf>=1.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# `portfolio_agent` is a PEP 420 namespace shared with the agents (portfolio_agent.layout / .engine / ... live in agents/*): never add an __init__.py to it.
[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_agent"]
