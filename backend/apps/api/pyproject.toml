[project]
name = "pascal-api"
version = "0.2.0"
description = "HTTP service over the portfolio agents (sources -> book plan -> composed book -> fresh review)"
requires-python = ">=3.11"
dependencies = [
  "portfolio-core",
  "portfolio-book-agent",
  "portfolio-sourceprep-agent",
  "portfolio-review-agent",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
]

[project.scripts]
pascal-api = "pascal_api.cli:serve"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pascal_api"]
