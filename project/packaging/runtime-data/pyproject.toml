[project]
name = "portfolio-runtime-data"
version = "0.1.0"
description = "Local-only runtime resources for the Portfolio Agent wheel installation"
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_runtime_data"]

[tool.hatch.build.targets.wheel.force-include]
"../../../agents/portfolioAgent/knowledge/patterns/layout-patterns.json" = "portfolio_runtime_data/agents/portfolioAgent/knowledge/patterns/layout-patterns.json"
"../../../agents/portfolioAgent/knowledge/patterns/grid-systems.json" = "portfolio_runtime_data/agents/portfolioAgent/knowledge/patterns/grid-systems.json"
"../../../agents/portfolioAgent/knowledge/patterns/compositions.json" = "portfolio_runtime_data/agents/portfolioAgent/knowledge/patterns/compositions.json"
"../../../agents/portfolioAgent/knowledge/patterns/compositions-pascal.json" = "portfolio_runtime_data/agents/portfolioAgent/knowledge/patterns/compositions-pascal.json"
"../../../agents/portfolioAgent/knowledge/patterns/photosets.json" = "portfolio_runtime_data/agents/portfolioAgent/knowledge/patterns/photosets.json"
"../../../agents/portfolioAgent/knowledge/editorial/layout-craft.md" = "portfolio_runtime_data/agents/portfolioAgent/knowledge/editorial/layout-craft.md"
"../../../agents/portfolioAgent/backends/local/adapter.py" = "portfolio_runtime_data/agents/portfolioAgent/backends/local/adapter.py"
"../../../agents/reviewAgent/knowledge/critic-rubric.md" = "portfolio_runtime_data/agents/reviewAgent/knowledge/critic-rubric.md"
"../../../agents/portfolio-plugin/skills/portfolio-create/SKILL.md" = "portfolio_runtime_data/agents/portfolio-plugin/skills/portfolio-create/SKILL.md"
